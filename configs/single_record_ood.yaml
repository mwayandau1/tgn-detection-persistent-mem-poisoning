# Config for generating a "single isolated poisoned record" OOD stress set.
# Exactly 1 poisoned record is injected per sequence, with no similar sibling
# ever added - the sharpest edge case identified from the slow-attack probe:
# detection saturated with as few as 2 mutually-similar poisoned records
# (they form an edge above the 0.6 cosine threshold), but no window in that
# run ever contained exactly 1. This tests whether the detector needs that
# pairwise edge to fire at all, or can flag a single semantically-isolated
# planted memory on its own.

api_rate_limit: 5.0

simulation:
  num_sequences: 25
  interactions_per_sequence: 200
  memory_size_baseline: 300
  snapshot_interval: 10
  embedding_dim: 384
  semantic_edge_threshold: 0.6
  domain: "customer_support"

attacks:
  types:
    - name: "single_isolated"
      description: "Exactly one poisoned record injected once, no sibling ever added"
      num_injected_records: 1
      injection_spread: 1
      semantic_coherence: 0.75

  target_neighborhood_size: 20
  attack_ratio: 1.0

model:
  node_feature_dim: 384
  node_memory_dim: 128
  gat_hidden_dim: 128
  gat_heads: 4
  gat_layers: 2
  gru_hidden_dim: 128
  mlp_hidden_dim: 64
  dropout: 0.3

training:
  temporal_window: 10
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs_contrastive: 10
  epochs_supervised: 10
  early_stopping_patience: 10
  gradient_clip: 1.0
  focal_loss_gamma: 3.0
  focal_loss_alpha: 0.85
  loss_alpha: 1.0
  loss_beta: 1.5
  loss_gamma: 0.3
  oversample_ratio: 3

evaluation:
  metrics: ["auroc", "f1", "average_precision", "detection_latency", "fpr_at_tpr90"]
  target_auroc: 0.85
  ood_auroc_drop_threshold: 0.05

dataset:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42

# Configuration read by the detector, the dataset generator and every evaluation script.
#
# Values are the recipe behind experiments/audit/RESULTS_FREEZE.md. Each training run also
# writes the full resolved configuration to its run_config.json. The configuration the
# withdrawn LLM generator read is kept in archive/llm_benchmark/default_llm_era.yaml.

# === Memory graph (src/data_generation/agentpoison_sequences.py) ===
simulation:
  interactions_per_sequence: 200  # interactions per simulated agent
  snapshot_interval: 10           # one graph snapshot every N interactions (20 per sequence)
  embedding_dim: 384              # all-MiniLM-L6-v2 sentence embedding
  semantic_edge_threshold: 0.6    # edge where cosine similarity > threshold

# === Detector (src/models/tgn_detector.py) ===
model:
  node_feature_dim: 384           # embedding width; the 3 behavioural and 4 structural columns
                                  # are added by the trainer (node_meta_dim = 7)
  node_memory_dim: 128            # per-node GRU memory
  gat_hidden_dim: 128             # graph attention hidden width (2 layers, 4 heads then 1)
  gat_heads: 4
  gru_hidden_dim: 128             # temporal aggregator
  mlp_hidden_dim: 64              # scoring heads and attention pooling
  dropout: 0.3                    # readout defaults to attention pooling (train.py --readout)
  memory_slots: per_window        # per_window (as specified) | shared (legacy, pre-freeze runs)

# === Training (src/models/train.py) ===
training:
  temporal_window: 10             # snapshots per window
  batch_size: 4                   # sized for a 4 GB GPU (Quadro P2000)
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs_contrastive: 10          # optional contrastive phase; not run for any reported model
  epochs_supervised: 12           # every reported run: 12 epochs
  early_stopping_patience: 10     # on validation AUROC; never triggered in 12 epochs
  gradient_clip: 1.0
  focal_loss_gamma: 3.0           # node-level focal loss
  focal_loss_alpha: 0.85          # weight on the positive (injected) class
  loss_alpha: 1.0                 # weight on the graph-level loss
  loss_beta: 1.5                  # weight on the node-level loss

# === Evaluation ===
evaluation:
  target_auroc: 0.85              # acceptance criterion fixed before evaluation (Section 3.12);
                                  # documented here, not read by code

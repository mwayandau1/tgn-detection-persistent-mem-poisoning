# Configuration for Large-Scale Training on vast.ai GPU
# Use with: ./scripts/run_experiment.sh all --large

# === API Settings ===
api_rate_limit: 5.0

# === Agent Memory Simulation ===
simulation:
  num_sequences: 1000           # 3x more data for better generalization
  interactions_per_sequence: 300 # Longer sequences = larger graphs
  memory_size_baseline: 300
  snapshot_interval: 10
  embedding_dim: 384
  semantic_edge_threshold: 0.6
  domain: "customer_support"

# === Attack Configuration ===
attacks:
  types:
    - name: "minja_query_only"
      description: "Query-only injection via bridging steps (MINJA-style)"
      num_injected_records: 15
      injection_spread: 30
      semantic_coherence: 0.85

    - name: "direct_write"
      description: "Privileged attacker with direct memory write access"
      num_injected_records: 10
      injection_spread: 1
      semantic_coherence: 0.90

    - name: "incremental_slow"
      description: "Low-and-slow gradual poisoning over many sessions"
      num_injected_records: 20
      injection_spread: 100
      semantic_coherence: 0.75

  target_neighborhood_size: 20
  attack_ratio: 0.4

# === Model Architecture ===
model:
  node_feature_dim: 384         # Input from sentence encoder (model adds +3 meta features internally)
  node_memory_dim: 128
  gat_hidden_dim: 128
  gat_heads: 4
  gat_layers: 2
  gru_hidden_dim: 128
  mlp_hidden_dim: 64
  dropout: 0.3

# === Training ===
training:
  temporal_window: 10
  batch_size: 32                # Larger batch for GPU utilization
  learning_rate: 0.0003         # Slightly higher with larger batch
  weight_decay: 0.00001
  epochs_contrastive: 15        # More epochs for larger dataset
  epochs_supervised: 30         # More epochs — early stopping will trigger if needed
  early_stopping_patience: 8
  gradient_clip: 1.0
  focal_loss_gamma: 2.0
  loss_alpha: 1.0
  loss_beta: 0.5
  loss_gamma: 0.3
  oversample_ratio: 3

# === Evaluation ===
evaluation:
  metrics: ["auroc", "f1", "average_precision", "detection_latency", "fpr_at_tpr90"]
  target_auroc: 0.85
  ood_auroc_drop_threshold: 0.05

# === Dataset Split ===
dataset:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42

# Config for generating a held-out "genuinely slow" incremental_slow OOD stress set.
# Only incremental_slow sequences are generated (attack_ratio=1.0, single attack type) -
# clean_*, minja_query_only, and direct_write sequences in data/raw/llm_generated are
# untouched by this config.
#
# injection_spread (200) is widened well past temporal_window * snapshot_interval (10*10=100),
# so a single detection window can no longer see the entire injected cluster at once.
# interactions_per_sequence is raised to 300 (from 200) so no injected records get
# truncated off the end of the sequence (start=50..80, spread=200 -> last injection ~t=280).

api_rate_limit: 5.0

simulation:
  num_sequences: 20
  interactions_per_sequence: 300
  memory_size_baseline: 300
  snapshot_interval: 10
  embedding_dim: 384
  semantic_edge_threshold: 0.6
  domain: "customer_support"

attacks:
  types:
    - name: "incremental_slow"
      description: "Low-and-slow gradual poisoning, spread well beyond one detection window"
      num_injected_records: 20
      injection_spread: 200
      semantic_coherence: 0.75

  target_neighborhood_size: 20
  attack_ratio: 1.0

model:
  node_feature_dim: 384
  node_memory_dim: 128
  gat_hidden_dim: 128
  gat_heads: 4
  gat_layers: 2
  gru_hidden_dim: 128
  mlp_hidden_dim: 64
  dropout: 0.3

training:
  temporal_window: 10
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.00001
  epochs_contrastive: 10
  epochs_supervised: 10
  early_stopping_patience: 10
  gradient_clip: 1.0
  focal_loss_gamma: 3.0
  focal_loss_alpha: 0.85
  loss_alpha: 1.0
  loss_beta: 1.5
  loss_gamma: 0.3
  oversample_ratio: 3

evaluation:
  metrics: ["auroc", "f1", "average_precision", "detection_latency", "fpr_at_tpr90"]
  target_auroc: 0.85
  ood_auroc_drop_threshold: 0.05

dataset:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  seed: 42

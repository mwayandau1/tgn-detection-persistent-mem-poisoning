[project]
name = "tgn-memory-poisoning"
version = "1.0.0"
description = "Temporal graph neural network detection of persistent memory poisoning in LLM agents (KNUST MSc thesis code)"
readme = "README.md"
requires-python = ">=3.12"
# requirements.txt pins the exact versions that produced the reported results; these are the
# minimum versions the code is expected to work with.
dependencies = [
    "torch>=2.5",
    "torch-geometric>=2.8",
    "numpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "networkx>=3.2",
    "sentence-transformers>=2.2",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]
